.stat-label{font-size:11px;color:#888;margin-bottom:2px}

.progress-bar{height:4px;background:#f0f0ee;border-radius:2px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;border-radius:2px;transition:width 0.3s}
.pA{background:#378ADD}.pB{background:#1D9E75}
.section{margin-bottom:1rem}
.sec-header{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:9px 12px;background:#fff;border-radius:8px;border:1px solid #eee;margin-bottom:3px}
.sec-left{display:flex;align-items:center;gap:10px}
.sec-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.sec-title{font-size:13px;font-weight:600;color:#1a1a18}
.sec-meta{font-size:11px;color:#999}
.chev{font-size:13px;color:#bbb;transition:transform 0.2s;display:inline-block}
.chev.open{transform:rotate(180deg)}
.table-wrap{overflow-x:auto;background:#fff;border:1px solid #eee;border-radius:0 0 8px 8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:7px 10px;color:#aaa;font-weight:500;border-bottom:1px solid #f0f0ee;font-size:11px;white-space:nowrap}
th.c{text-align:center}
td{padding:7px 10px;border-bottom:1px solid #f8f8f6;color:#1a1a18;vertical-align:middle}
td.c{text-align:center}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}
.diff{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:500;margin-left:5px}
.easy{background:#eaf3de;color:#3B6D11}
.medium{background:#faeeda;color:#854F0B}
.cb-a{width:17px;height:17px;cursor:pointer;accent-color:#378ADD}
.cb-b{width:17px;height:17px;cursor:pointer;accent-color:#1D9E75}
.btn{padding:6px 12px;font-size:12px;border-radius:8px;border:1px solid #ddd;background:#fff;color:#1a1a18;cursor:pointer;font-weight:500}
.btn:hover{background:#f5f5f3}
.btn.danger{border-color:#E24B4A;color:#E24B4A}
.lk{color:#378ADD;text-decoration:none}

// ── Firebase state ──
let DB_URL = localStorage.getItem("fb_url") || "https://dsa-tracker-de40f-default-rtdb.firebaseio.com";

let collapsed = {6:true};
let syncTimeout = null;

function setSync(status, msg){
  const el = document.getElementById("syncStatus");
  el.className = "sync-status sync-"+status;
  el.textContent = msg;
}

function saveFirebaseUrl(){
  const val = document.getElementById("fb-url-input").value.trim().replace(/\/$/,"");
  if(!val.startsWith("https://")){alert("Invalid URL");return;}
  DB_URL = val;
  localStorage.setItem("fb_url", DB_URL);
  document.getElementById("firebase-setup-banner").style.display="none";
  setSync("wait","⏳ Connecting...");
  startListening();
}

// ── Firebase REST helpers ──
async function fbGet(path){
  const r = await fetch(DB_URL+path+".json");
  if(!r.ok) throw new Error(r.status);
  return r.json();
}
async function fbPatch(path, data){
  const r = await fetch(DB_URL+path+".json",{
    method:"PATCH",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(data)
  });
  if(!r.ok) throw new Error(r.status);
  return r.json();
}
async function fbPut(path, data){
  const r = await fetch(DB_URL+path+".json",{
    method:"PUT",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(data)
  });
  if(!r.ok) throw new Error(r.status);
  return r.json();
}

  try{
    const remote = await fbGet("/tracker");
    const h = JSON.stringify(remote);
    if(h !== lastRemoteHash){
      lastRemoteHash = h;
      if(remote){
        state.nameA = remote.nameA||"";
        state.nameB = remote.nameB||"";
        state.checked = remote.checked||{};
        render();
      }
    }
    setSync("ok","🟢 Synced");
  }catch(e){
    setSync("err","🔴 Sync error");
  }
}

function startListening(){
  poll();
  setInterval(poll, 4000);
}

// ── Push changes to Firebase ──
async function pushState(){
  if(!DB_URL){setSync("err","🔴 No DB URL");return;}
  try{
    await fbPut("/tracker", {
      nameA: state.nameA,
      nameB: state.nameB,
      checked: state.checked
    });
    lastRemoteHash = JSON.stringify({nameA:state.nameA,nameB:state.nameB,checked:state.checked});
    setSync("ok","🟢 Synced");
  }catch(e){
    setSync("err","🔴 Sync failed");
  }
}

function debouncedPush(){
  if(syncTimeout) clearTimeout(syncTimeout);
  syncTimeout = setTimeout(pushState, 600);
}

// ── App logic ──
function key(si,qi,who){return si+"__"+qi+"__"+who}

function saveName(who,val){
  state["name"+who]=val;
  debouncedPush();
  updateStats();
}

function toggle(k){
  state.checked[k]=!state.checked[k];
  debouncedPush();
  updateStats();
  const cb=document.getElementById("cb_"+k);
  if(cb)cb.checked=!!state.checked[k];
  const parts=k.split("__");
  updateSecMeta(parseInt(parts[0]));
}

function updateStats(){
  const nA=state.nameA||"Ankur";
  const nB=state.nameB||"Vidhi";
  document.getElementById("lbA").textContent=nA;
  document.getElementById("lbB").textContent=nB;
  let tot=0,dA=0,dB=0;
  DATA.forEach((sec,si)=>{
    sec.qs.forEach((q,qi)=>{
      tot++;
      if(state.checked[key(si,qi,"A")])dA++;
      if(state.checked[key(si,qi,"B")])dB++;
    });
    updateSecMeta(si);
  });
  document.getElementById("totQ").textContent=tot;
  document.getElementById("cntA").textContent=dA+"/"+tot;
  document.getElementById("cntB").textContent=dB+"/"+tot;
  document.getElementById("barA").style.width=Math.round(dA/tot*100)+"%";
  document.getElementById("barB").style.width=Math.round(dB/tot*100)+"%";
}

function updateSecMeta(si){
  const sec=DATA[si];
  let dA=0,dB=0;
  sec.qs.forEach((q,qi)=>{
    if(state.checked[key(si,qi,"A")])dA++;
    if(state.checked[key(si,qi,"B")])dB++;
  });
  const el=document.getElementById("sm_"+si);
  const nA=state.nameA||"Ankur";
  const nB=state.nameB||"Vidhi";
  if(el)el.textContent=nA+": "+dA+"/"+sec.qs.length+" · "+nB+": "+dB+"/"+sec.qs.length;
}

function toggleSec(si){
  collapsed[si]=!collapsed[si];
  const body=document.getElementById("sb_"+si);
  const chev=document.getElementById("ch_"+si);
  if(body)body.style.display=collapsed[si]?"none":"block";
  if(chev)chev.className="chev"+(collapsed[si]?"":" open");
  chev.textContent=collapsed[si]?"▶":"▼";
}

async function resetAll(){
  if(!confirm("Reset ALL progress for both people? Cannot be undone."))return;
  state.checked={};
  await pushState();
  render();
}

function render(){
  document.getElementById("nameA").value=state.nameA||"";
  document.getElementById("nameB").value=state.nameB||"";
  const container=document.getElementById("sections");
  container.innerHTML="";
  const nA=state.nameA||"Ankur";
  const nB=state.nameB||"Vidhi";

  DATA.forEach((sec,si)=>{
    const isOpen=!collapsed[si];
    let dA=0,dB=0;
    sec.qs.forEach((q,qi)=>{
      if(state.checked[key(si,qi,"A")])dA++;
      if(state.checked[key(si,qi,"B")])dB++;
    });
    const div=document.createElement("div");
    div.className="section";
    div.innerHTML=`
      <div class="sec-header" onclick="toggleSec(${si})">
        <div class="sec-left">
          <span class="sec-dot" style="background:${sec.color}"></span>
          <span class="sec-title">${sec.name}</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="sec-meta" id="sm_${si}">${nA}: ${dA}/${sec.qs.length} · ${nB}: ${dB}/${sec.qs.length}</span>
          <span class="chev${isOpen?" open":""}" id="ch_${si}">${isOpen?"▼":"▶"}</span>
        </div>
      </div>
      <div id="sb_${si}" style="display:${isOpen?"block":"none"}">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Question</th>
                <th class="c" style="color:#378ADD">${nA}</th>
                <th class="c" style="color:#1D9E75">${nB}</th>
              </tr>
            </thead>
            <tbody>
              ${sec.qs.map((q,qi)=>`
                <tr>
                  <td><span class="num">${qi+1}</span></td>
                  <td>
                    <a href="${q.url}" class="lk" target="_blank">${q.t}</a>
                    <span class="diff ${q.d.toLowerCase()}">${q.d}</span>
                  </td>
                  <td class="c"><input type="checkbox" class="cb-a" id="cb_${key(si,qi,'A')}" ${state.checked[key(si,qi,"A")]?"checked":""} onchange="toggle('${key(si,qi,'A')}')"/></td>
                  <td class="c"><input type="checkbox" class="cb-b" id="cb_${key(si,qi,'B')}" ${state.checked[key(si,qi,"B")]?"checked":""} onchange="toggle('${key(si,qi,'B')}')"/></td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      </div>`;
    container.appendChild(div);
  });
  updateStats();
}

// ── Init ──
if(DB_URL){
  document.getElementById("firebase-setup-banner").style.display="none";
  document.getElementById("fb-url-input").value=DB_URL;
  setSync("wait","⏳ Connecting...");
  startListening();
} else {
  setSync("err","🔴 Not connected");
}
render();
</script>
</body>
</html>
